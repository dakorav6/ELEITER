  static now(){return new TS(Date.now())} static fromDate(d){return new TS(+d)}}
const Timestamp=TS, serverTimestamp=()=>({__sv:1});
const enc=v=>{ if(v&&v.__sv) return {__ts:Date.now()}; if(v instanceof TS) return {__ts:v.ms};
  if(v&&typeof v==='object') return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,enc(x)])); return v; };
const rev=v=>{ if(v&&typeof v==='object'){ if('__ts' in v) return new TS(v.__ts); for(const k in v) v[k]=rev(v[k]); } return v; };
const rd=x=>rev(JSON.parse(JSON.stringify(x)));
/* Catálogo de estados del chofer (7 etapas). askLoad: pide el % de volumen cargado · askNotes: pide novedades */
const STATUS_DEFAULTS=[['Salida de planta',0,0],['Llegada a bodega del proveedor',0,0],['Cargando material',0,0],['Salida de bodega del proveedor',1,0],
  ['Llegada a planta',0,0],['Descargando material',0,0],['Camión descargado',0,1]];
const NSTEP=STATUS_DEFAULTS.length;
const KEY='demo_logistica_v7', subs=new Set();
function demo(){
  const d={users:{},trucks:{},statuses:{},trips:{},routes:{},requests:{}}; let i=0;
  const put=(c,o)=>{const k='d'+(i++); d[c][k]=o; return k;};
  /* El Excel de báscula no trae ciudad: para la demo se asigna una ciudad estable por proveedor (se reemplaza al importar datos reales). */
  const CITIES=['Guayaquil','Quevedo','Machala','Cuenca','El Empalme','Naranjito','Santa Elena','Milagro','Daule','Babahoyo','Durán','Manta'];
  const cityOf=s=>CITIES[[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%CITIES.length];
  /* Datos de prueba de la hoja de programación: ayudantes, tulas y kilos a cargar (estables por ruta). Se reemplazan al importar el Excel. */
  const POOLA=['Mendoza Carlos','Maquilon Luis','Burgos Gabriel','Silva Alfredo','Malaga Rene','Torres Marcos','Torres Oscar','Santana Luis','Criollo Gustavo','Merchan Anthony','Lozano Elkin'];
  const hh=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,11);
  const putR=o=>{ const h=hh(o.route), n=POOLA.length, i1=h%n, c=CAP[o.plate]||5;
    return put('routes',{...o,city:o.city??cityOf(o.supplier),ayud1:POOLA[i1],...(h%3?{ayud2:POOLA[(i1+1+((h>>3)%(n-1)))%n]}:{}),
      tulas:h%4?h%46:0,cargar:o.cargar??Math.round(c*1000*(.4+(h%6)/10)/100)*100}); };
  const CAP={'GBP-2969':20,'GBP-9993':10,'NBA-1190':8,'KBA-1226':8,'GBP-7833':5,'GQF-0713':5,'GSJ-4626':5,'GRP-0009':5,'GSN-2131':5,'GBQ-1014':2.5,'GSW-7452':2.5};   // capacidad en TM, según el calendario semanal
  const t0=new Date(); t0.setHours(0,0,0,0); const day=t0.getTime(), h=36e5;
  put('users',{username:'admin',pin:'1234',role:'admin'}); put('users',{username:'chofer1',pin:'1111',role:'chofer'}); put('users',{username:'chofer2',pin:'2222',role:'chofer'});
  [...new Set(HIST.flatMap(x=>[x.placaSB,x.placa]))].sort().forEach(p=>put('trucks',CAP[p]?{plate:p,cap:CAP[p]}:{plate:p}));
  STATUS_DEFAULTS.forEach(([n,a,o],k)=>put('statuses',{name:n,order:k+1,askLoad:!!a,askNotes:!!o}));
  /* Rutas y viajes del dashboard: salen del Excel real (HIST). Lo que normalmente marca el chofer en la app
     (las 7 etapas, el % de carga y las novedades) se SIMULA con horas coherentes
     con la salida de planta y la báscula del Excel; esos viajes llevan simulado:true. */
  const cap=s=>String(s??'').toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/S\.a\./g,'S.A.');
  const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};   // determinista por ruta
  HIST.slice().sort((x,y)=>Date.parse(x.fechaAsignada)-Date.parse(y.fechaAsignada)).forEach(x=>{
    const R=rng(x.ruta), r=(lo,hi)=>lo+(hi-lo)*R(), M=6e4;
    const A=Date.parse(x.fechaAsignada), SB=Date.parse(x.fechaSB), S0=x.fechaSalida?Date.parse(x.fechaSalida):null;
    const S=S0??A+Math.round(r(10,40))*M;                              // sin salida en el sistema: se inventa una tras la hora asignada
    const driver=cap(x.choferSB), supplier=cap(x.proveedor), plate=x.placaSB;
    const rid=putR({route:String(x.ruta),plate,driver,supplier,departure:{__ts:A},cargar:x.pesoAsesor>0?x.pesoAsesor:undefined});
    const U=Math.max(SB-Math.round(r(5,20))*M-S,(SB-S)*.6);             // salida de planta → llegada a planta (antes del pesaje)
    const carga=Math.min(r(45,180)*M,U*.35), rest=U-carga, ida=rest*r(.35,.5), trans=rest-ida;
    // 7 etapas: salida de planta · llegada proveedor · cargando · salida proveedor · llegada a planta · descargando · descargado
    const e1=S, e2=S+ida, e3=e2+Math.min(r(3,12)*M,carga*.3), e4=e2+carga, e5=S+U, e6=SB+r(10,30)*M, e7=e6+r(20,60)*M;
    const cum=x.pesoAsesor>0?x.pesoSb/x.pesoAsesor:1;
    const load=x.pesoSb<=0?0:Math.min(100,Math.max(15,Math.round((Math.min(cum,1)*85+r(0,15))/5)*5));   // % de carga acorde al peso de báscula
    const nov=r(0,1)<.2?'Demora en la descarga por fila de camiones':'Sin novedades';
    const ts={}; [e1,e2,e3,e4,e5,e6,e7].forEach((v,i)=>ts['s'+(i+1)]={__ts:Math.round(v)});
    put('trips',{routeId:rid,route:String(x.ruta),plate,driver,supplier,username:driver,departure:{__ts:S0??A},currentStep:NSTEP,status:'done',
      createdAt:{__ts:Math.min(A,S)},finishedAt:{__ts:Math.round(e7)},loadPct:load,novedades:nov,ts,simulado:true});
  });
  /* Rutas de hoy para probar el flujo del chofer y las alertas de FLOTA ESTADO. Sus horas son relativas al momento en que se carga la demo:
     GBQ-1014 tiene la ruta 5653 en curso y la 5650 sale en ~20 min (alerta naranja); GRP-0009 tiene la 5654 en curso y la 5651 debió salir hace 15 min (alerta roja). */
  const n5=Math.floor(Date.now()/3e5)*3e5, MIN=6e4;
  putR({route:'5650',plate:'GBQ-1014',driver:'Cesar Bravo',supplier:'Pronaca',departure:{__ts:n5+20*MIN},simulado:true});
  putR({route:'5651',plate:'GRP-0009',driver:'Cesar Intriago',supplier:'Enlit',departure:{__ts:n5-15*MIN},simulado:true});
  putR({route:'5652',plate:'GBP-9993',driver:'Xavier Heredia',supplier:'Heineken Ecuador S.A.',departure:{__ts:n5+180*MIN},simulado:true});
  putR({route:'5656',plate:'GSN-2131',driver:'Mairo Triviño',supplier:'Vergara Pico Jefferson Joel',departure:{__ts:n5+240*MIN},simulado:true});   // camión libre: sirve para probar el inicio de ruta del chofer
  const enCurso=(route,plate,driver,supplier,desde,step,load)=>{ const dep=n5-desde*MIN, ts={}; [5,35,40,95,125,140,160].slice(0,step).forEach((m,i)=>ts['s'+(i+1)]={__ts:dep+m*MIN});
    const rid=putR({route,plate,driver,supplier,departure:{__ts:dep},simulado:true});
    put('trips',{routeId:rid,route,plate,driver,supplier,username:driver,departure:{__ts:dep},currentStep:step,status:'active',createdAt:{__ts:dep},loadPct:load,ts,simulado:true}); };
  enCurso('5653','GBQ-1014','Cesar Bravo','Heineken Ecuador S.A.',150,5,90);   // llegó a planta
  enCurso('5654','GRP-0009','Cesar Intriago','Michelena Chavez Gary',180,4,75);  // salió del proveedor
  enCurso('5655','GBP-9993','Xavier Heredia','Transarc S.A.',90,3,null);        // cargando material; la próxima (5652) sale en 3 h: sin alerta → marco verde
  /* Calendario semanal: rutas de la semana actual y la siguiente (relativas a hoy) para ver celdas con varias rutas y los estados
     CANCELADO / REAGENDADO (campo schedStatus en la ruta). Usan placas sin viaje en curso para no alterar las alertas de FLOTA ESTADO. */
  const wk=day-((new Date(day).getDay()+6)%7)*864e5, DAY=864e5;
  [['5660','KBA-1226','Cesar Holguin','Agustín Torres','Machala',2,7,'reagendado'],
   ['5661','GBP-7833','Luis Enrique Veliz Calle','Manuel Herrera','El Empalme',3,9,'cancelado'],
   ['5662','GQF-0713','Omar Veliz','Miguel Freire','Naranjito',1,10,'reagendado'],
   ['5663','GBP-2969','Cesar Holguin','Mabe Ecuador','Cuenca',9,7,''],
   ['5664','GBP-2969','Cesar Holguin','Heineken Ecuador S.A.','Guayaquil',9,14,''],
   ['5665','GSN-2131','Mairo Triviño','Cristóbal Delgado','Quevedo',10,8,''],
   ['5666','KBA-1226','Cesar Holguin','José Sánchez','Cuenca',8,6.5,'cancelado'],
   ['5667','GSJ-4626','Luis Veliz','Guachichulca','Cuenca',11,8,''],
   ['5668','GBP-7833','Luis Enrique Veliz Calle','Recicladora Reciferro','Santa Elena',8,9,'']]

    .forEach(([supplier,city,tons,dOff])=>put('requests',{supplier,city,tons,requestedFor:{__ts:day+dOff*DAY+8*h}}));

let S = JSON.parse(localStorage.getItem('sess') || 'null');         // sesión {id, username, role}
let unsubs = [];
const clean = () => { unsubs.forEach(u => u()); unsubs = []; };

/* Datos iniciales: admin/1234 y estados por defecto (solo si están vacíos) */
async function seed() {
  if ((await getDocs(col('users'))).empty)
    await addDoc(col('users'), {username:'admin', pin:'1234', role:'admin'});
  if ((await getDocs(col('statuses'))).empty)
    for (const [i,[n,a,o]] of STATUS_DEFAULTS.entries())
      await addDoc(col('statuses'), {name:n, order:i+1, askLoad:!!a, askNotes:!!o});   // askLoad: pide % de carga · askNotes: pide novedades
}

/* ============ 3. LOGIN ============ */
function loginView() {
  clean();
  app.innerHTML = `
  <main class="min-h-screen grid place-items-center p-4" style="background:radial-gradient(ellipse at top,#e6f2d3 0,#f3f7f1 55%)">
    <form id="f" class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6 space-y-4 border-t-4 border-eco-500">
      <img src="${LOGO_F}" alt="Ecoresa Group · Soluciones para la vida" class="w-60 mx-auto">
      <h1 class="text-2xl font-bold text-resa-700 text-center">Control de camiones</h1>
      <p class="text-sm bg-eco-50 border border-eco-200 rounded-lg p-3">Versión de demostración. Admin: <b>admin / 1234</b> · Chofer: <b>chofer1 / 1111</b>. Ruta de prueba para iniciar: 5656. Las rutas 5650, 5651 y 5652 quedan bloqueadas porque su camión ya está en otra ruta en curso.</p>
      <input id="u" class="${INP}" placeholder="Nombre de usuario" autocomplete="username" required>
      <input id="p" class="${INP}" placeholder="PIN" type="password" inputmode="numeric" required>
      <p id="err" class="text-red-600 text-sm"></p>
      <button class="${B} w-full bg-resa-600 text-white hover:bg-resa-700">Ingresar</button>
      <button type="button" id="rst" class="text-xs underline text-stone-500 w-full">Restablecer datos de demo</button>
    </form>
  </main>`;
  $('#rst').onclick = () => { localStorage.removeItem(KEY); localStorage.removeItem('sess'); location.reload(); };
  $('#f').onsubmit = async e => {
    e.preventDefault();
    $('#err').textContent = 'Conectando…';
    const slow = setTimeout(() => $('#err').textContent =
      'Sin respuesta de Firestore. Revisa: base creada, projectId, reglas y bloqueadores de anuncios.', 10000);
    try {
      await seed();
      clearTimeout(slow);
      const snap = await getDocs(query(col('users'), where('username','==',$('#u').value.trim())));
      const u = snap.docs.map(d => ({id:d.id, ...d.data()})).find(x => x.pin === $('#p').value.trim());
      if (!u) return $('#err').textContent = 'Usuario o PIN incorrecto';
      S = {id:u.id, username:u.username, role:u.role};
      localStorage.setItem('sess', JSON.stringify(S));
      route();
    } catch (er) {
      clearTimeout(slow);
      $('#err').textContent = 'Error de Firebase: ' + (er.code || er.message);
    }
  };
}
const logout = () => { localStorage.removeItem('sess'); S = null; route(); };
const header = t => `<header class="shadow-sm">
  <div class="bg-white">
    <div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center gap-3">
      <img src="${LOGO_H}" alt="Ecoresa Group" class="h-7 sm:h-9 w-auto">
      <span class="text-sm text-stone-600 shrink-0">${esc(S.username)} · <button id="out" class="underline font-semibold text-resa-700">Salir</button></span>
    </div>
  </div>
  <div style="background:linear-gradient(90deg,#6b9a34,#238078)" class="text-white">
    <div class="max-w-7xl mx-auto px-4 py-2 brand font-bold tracking-wide">${t}</div>
  </div>
</header>`;

function route() {
  clean();
  if (!S) return loginView();
  S.role === 'admin' ? adminView() : driverView();
}

/* ============ 4. FLUJO DEL CHOFER ============ */
const tripKey = () => 'trip_' + S.id;
const driverView = () => localStorage.getItem(tripKey()) ? stepsView() : startView();

/* Pantalla 1: solo el número de ruta. La placa, proveedor y chofer salen de la colección "routes" */
function startView() {
  app.innerHTML = header('Iniciar ruta') + `
  <form id="f" class="max-w-md mx-auto p-4 space-y-4">
    <input id="route" class="${INP} text-xl text-center" placeholder="Número de ruta" required>
    <p id="err" class="text-red-600 text-sm"></p>
    <button class="${B} w-full bg-resa-600 text-white text-lg hover:bg-resa-700">Continuar</button>
  </form>`;
  $('#out').onclick = logout;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const rs = await getDocs(query(col('routes'), where('route','==',$('#route').value.trim())));
    if (rs.empty) return $('#err').textContent = 'No existe esa ruta. Revisa el número.';
    const r = {id: rs.docs[0].id, ...rs.docs[0].data()};
    if (r.schedStatus) return $('#err').textContent = `La ruta ${r.route} está ${r.schedStatus === 'cancelado' ? 'cancelada' : 'reagendada'} y no se puede iniciar.`;
    const prev = (await getDocs(query(col('trips'), where('routeId','==',r.id)))).docs;
    let id = prev.find(d => d.data().status === 'active')?.id;          // si ya hay viaje activo, se retoma
    if (!id && prev.length) return $('#err').textContent = 'Esa ruta ya fue completada.';
    if (!id) {                                                          // un camión no puede iniciar otra ruta si ya tiene una en curso
      const busy = (await getDocs(query(col('trips'), where('status','==','active')))).docs.map(d => d.data())
        .find(t => plateKey(t.plate) === plateKey(r.plate) && t.routeId !== r.id);
      if (busy) return $('#err').textContent = `El camión ${r.plate} ya está en la ruta ${busy.route}. Debe finalizarla antes de iniciar otra.`;
    }
    if (!id) id = (await addDoc(col('trips'), {
      routeId: r.id, route: r.route, plate: r.plate, driver: r.driver, supplier: r.supplier,
      username: S.username, departure: r.departure, currentStep: 0, status: 'active',
      createdAt: serverTimestamp(), ts: {}
    })).id;
    localStorage.setItem(tripKey(), id);
    stepsView();
  };
}

/* Pantalla 2: estados en orden estricto; solo se puede marcar el siguiente */
async function stepsView() {
  const tripRef = doc(db, 'trips', localStorage.getItem(tripKey()));
  const trip = (await getDoc(tripRef)).data();
  if (!trip || trip.status === 'done') { localStorage.removeItem(tripKey()); return startView(); }
  const sts = (await getDocs(col('statuses'))).docs.map(d => d.data()).sort((a,b) => a.order - b.order).slice(0,NSTEP);

  const save = async (n, extra = {}) => {                              // guarda timestamp del servidor del estado n
    const last = n === sts.length;
    await updateDoc(tripRef, {currentStep: n, ['ts.s'+n]: serverTimestamp(), ...extra,
      ...(last ? {status:'done', finishedAt: serverTimestamp()} : {})});
    if (last) { localStorage.removeItem(tripKey()); startView(); } else stepsView();
  };

  app.innerHTML = header(`Ruta ${esc(trip.route)} · ${esc(trip.plate)}`) + `
  <div class="max-w-md mx-auto p-4 space-y-3">
    <p class="text-sm text-stone-500">${esc(trip.supplier)}</p>
    ${sts.map((s,i) => {
      const n = i+1, done = n <= trip.currentStep, next = n === trip.currentStep+1;
      return `<button data-n="${n}" ${next ? '' : 'disabled'} class="${B} w-full text-left text-lg ${
        done ? 'bg-eco-100 text-eco-800' : next ? 'bg-resa-600 text-white shadow hover:bg-resa-700' : 'bg-stone-200 text-stone-400'}">
        ${done ? '✓' : n}. ${esc(s.name)}${done && s.askLoad && trip.loadPct != null ? ` · ${trip.loadPct}%` : ''}</button>`;
    }).join('')}
  </div>`;
  $('#out').onclick = logout;
  document.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => {
    const n = +b.dataset.n, s = sts[n-1];
    s.askLoad ? loadView(trip, s.name, pct => save(n, {loadPct: pct}))
      : s.askNotes ? notesView(trip, s.name, txt => save(n, {novedades: txt})) : save(n);
  });
}

    <button id="none" class="${B} w-full bg-stone-200">Sin novedades</button>

/* Pregunta el % de carga cuando el estado tiene "askLoad" (salida de bodega del proveedor) */
function loadView(trip, name, onOk) {
  app.innerHTML = header(`Ruta ${esc(trip.route)} · ${esc(trip.plate)}`) + `

/* FLOTA ESTADO: una tarjeta por placa con 3 bloques separados: ANTES (completadas) · AHORA (en curso) · DESPUÉS (próxima ruta).
   Antes y después muestran fecha y hora (pueden ser de otro día). Alerta naranja: faltan ≤30 min para la próxima salida y la ruta
   en curso no ha terminado. Alerta roja: esa hora de salida ya llegó y el ciclo sigue sin completarse. */
function dashView() {
  const t = new Date(), iso = new Date(t - t.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  $('#content').innerHTML = `<div class="flex flex-wrap gap-3 justify-between items-end mb-2">
    <h2 class="text-xl font-bold text-resa-800">Flota estado</h2>
    <label class="text-sm text-stone-500">Fecha<input id="day" type="date" value="${iso}" class="${INP}"></label></div>
    <p class="text-xs text-stone-500 mb-4"><span class="inline-block w-2.5 h-2.5 rounded-full bg-eco-500 align-middle"></span> ruta en curso sin problema de tiempo ·
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-orange-400 align-middle"></span> faltan 30 min o menos para la próxima salida y la ruta en curso no ha terminado ·
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 align-middle"></span> ya llegó la hora de la próxima salida y el ciclo sigue sin completarse</p>
    <div id="cards" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3 items-start"></div>
    <section id="resumen" class="mt-6 pt-3 border-t border-stone-300"></section>`;
  let sts = [], routes = [], active = [], trips = [], trk = [], dl = [];
  const rows = s => s.docs.map(d => ({id:d.id, ...d.data()}));
  const dayTag = ts => { const f = d => new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    const diff = Math.round((Date.parse(fmt(ts).slice(0,10)) - Date.parse(f(new Date()))) / 864e5);
    return diff === 0 ? 'hoy' : diff === 1 ? 'mañana' : diff === -1 ? 'ayer' : ''; };
  const line = (dep, route, sup, cls = '') => `<div class="flex justify-between text-sm py-1 gap-2 ${cls}">
    <span class="shrink-0"><b>${dm(dep)}</b> <span class="text-xs text-stone-400">${dayTag(dep)}</span> · Ruta ${esc(route)}</span><span class="text-stone-500 text-right">${esc(sup)}</span></div>`;
  const sec = (label, color, inner, bg = '') => `<section class="px-4 py-3 ${bg}"><p class="text-xs font-bold tracking-wide ${color} mb-1">${label}</p>${inner}</section>`;
  const empty = txt => `<p class="text-sm text-stone-400">${txt}</p>`;

  const draw = () => {
    const dayVal = $('#day').value, [a, b] = dayRange(dayVal), now = Date.now(), inDay = x => +x >= +a && +x <= +b;
    const nowD = new Date(), todayIso = new Date(nowD - nowD.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    // pasado: solo rutas realizadas ese día · hoy: realizadas hoy + en curso + próxima · futuro: solo programadas ese día
    const mode = dayVal < todayIso ? 'past' : dayVal > todayIso ? 'future' : 'today';
    const all = [...new Map([...active, ...trips].map(x => [x.id, x])).values()];
    const started = new Set(all.map(x => x.routeId));
    const doneDay = all.filter(x => x.status !== 'active' && inDay(x.createdAt));
    const plates = [...new Set(mode === 'past' ? doneDay.map(x => x.plate)
      : mode === 'future' ? routes.filter(r => inDay(r.departure) && !started.has(r.id)).map(r => r.plate)
      : [...all.filter(x => x.status === 'active').map(x => x.plate), ...doneDay.map(x => x.plate), ...routes.filter(r => inDay(r.departure)).map(r => r.plate)])];
    const P = Object.fromEntries(plates.map(p => [p, {cur:[], done:[], next:[]}]));
    all.forEach(x => { const s = P[x.plate]; if (!s) return;
      if (x.status === 'active') { if (mode === 'today') s.cur.push(x); } else if (inDay(x.createdAt)) s.done.push(x); });
    if (mode !== 'past') routes.filter(r => !started.has(r.id)).forEach(r => P[r.plate]?.next.push(r));

    const cards = plates.map(p => {
      const s = P[p];
      s.done.sort((x, y) => x.departure - y.departure);
      s.cur.sort((x, y) => x.createdAt - y.createdAt); s.next.sort((x, y) => x.departure - y.departure);
      if (mode === 'future') s.next = s.next.filter(r => inDay(r.departure));
      const nx = s.next[0];                                           // hoy: solo la próxima ruta (puede ser de otro día)
      let alert = null;                                               // ciclo sin completar + hora de la próxima salida
      if (mode === 'today' && s.cur.length && nx) {
        const left = (+nx.departure - now) / 6e4, cur = s.cur.map(v => v.route).join(', ');
        if (left <= 0) alert = {lvl:0, box:'bg-red-100 text-red-800 border-red-300', ring:'ring-2 ring-red-500',
          msg:`Ya llegó la hora de salida de la ruta ${esc(nx.route)} (${dm(nx.departure)}, hace ${dur(-left)}) y la ruta ${esc(cur)} sigue en curso.`};
        else if (left <= 30) alert = {lvl:1, box:'bg-orange-100 text-orange-800 border-orange-300', ring:'ring-2 ring-orange-400',
          msg:`Faltan ${Math.ceil(left)} min para la salida de la ruta ${esc(nx.route)} (${dm(nx.departure)}) y la ruta ${esc(cur)} sigue en curso.`};
      }
      const antes = s.done.length ? s.done.map(v => line(v.departure, v.route, v.supplier, 'border-t first:border-t-0 text-stone-600')).join('')
        : empty('Ninguna aún');
      const ahora = s.cur.map(v => { const step = v.currentStep || 0, total = sts.length || NSTEP; return `<div class="border-l-4 border-resa-500 pl-3 py-1">
          <div class="flex justify-between items-start gap-2">
            <p class="font-semibold">Ruta ${esc(v.route)} · ${esc(v.supplier)}</p>
            ${v.loadPct != null ? `<span class="shrink-0 text-xs font-semibold bg-resa-50 text-resa-800 border border-resa-200 rounded-md px-2 py-0.5" title="Porcentaje de carga del camión">Volumen de carga ${v.loadPct}%</span>` : ''}
          </div>
          <p class="text-resa-700 font-semibold">${step ? esc(sts[step-1]?.name) : 'Por iniciar'}</p>
          <div class="h-2 bg-stone-200 rounded mt-1"><div class="h-2 bg-resa-500 rounded" style="width:${step/total*100}%"></div></div>
          <p class="text-xs text-stone-500 mt-1 flex justify-between"><span>${esc(v.driver)}${step ? ' · ' + dm(v.ts?.['s'+step]) : ''}</span><span>Etapa ${step} de ${total}</span></p></div>`; }).join('') || empty('Sin ruta en curso');
      const html = `<article class="bg-white rounded-xl shadow overflow-hidden ${alert ? alert.ring : (mode === 'today' && s.cur.length ? 'ring-2 ring-eco-500' : '')}">
        <div class="px-4 pt-4 pb-3"><b class="brand text-lg text-resa-800">${esc(p)}</b>
          ${alert ? `<div class="mt-2 rounded-lg border px-3 py-2 text-sm font-semibold ${alert.box}">⚠ ${alert.msg}</div>` : ''}</div>
        <div class="divide-y divide-stone-300 border-t border-stone-300">
          ${mode === 'future'
            ? sec('PROGRAMADAS' + ` (${s.next.length})`, 'text-resa-600', s.next.map(v => line(v.departure, v.route, v.supplier, 'border-t first:border-t-0')).join(''))
            : sec((mode === 'past' ? 'REALIZADAS' : 'ANTES · COMPLETADAS') + (s.done.length ? ` (${s.done.length})` : ''), 'text-stone-500', antes)}
          ${mode === 'today' ? sec('AHORA · EN CURSO', 'text-resa-700', ahora, 'bg-resa-50') : ''}
          ${mode === 'today' ? sec('DESPUÉS · PRÓXIMA RUTA', 'text-resa-600', nx ? line(nx.departure, nx.route, nx.supplier) : empty('Nada pendiente')) : ''}
        </div></article>`;
      return {p, lvl: alert ? alert.lvl : 2, html};
    }).sort((x, y) => x.lvl - y.lvl || (x.p > y.p ? 1 : -1));                // primero las alertas rojas, luego naranjas
    $('#cards').innerHTML = cards.length ? cards.map(c => c.html).join('') : `<p class="text-stone-500">${mode === 'past' ? 'No hubo rutas realizadas en esta fecha.' : mode === 'future' ? 'No hay rutas programadas para esta fecha.' : 'No hay rutas para esta fecha.'}</p>`;

    // RESUMEN DEL DÍA: pie compacto con la programación de la fecha elegida (mismo selector de fecha de esta pestaña)
    const capOf = Object.fromEntries(trk.map(t => [plateKey(t.plate), t.cap]));
    const hora = t => { const q = fmt(t), h = +q.slice(11,13); return `${h % 12 || 12}:${q.slice(14,16)} ${h < 12 ? 'a. m.' : 'p. m.'}`; };
    const prog = routes.filter(r => inDay(r.departure)).sort((x, y) => +x.departure - +y.departure || String(x.route).localeCompare(String(y.route), 'es', {numeric: true}));
    const TH = ['Ruta', 'Fecha', 'Placa', 'Ton', 'Chofer', 'Ayud. 1', 'Ayud. 2', 'Proveedor', 'Ciudad', 'Tulas', 'Salida', 'Cargar'];
    const td = (v, cls = '') => `<td class="px-2 py-1 whitespace-nowrap border-t border-stone-100 ${cls}" ${v ? `title="${esc(v)}"` : ''}>${esc(v ?? '')}</td>`;
    const tdt = (v, cls = '') => td(v, `max-w-[9rem] truncate ${cls}`);
    $('#resumen').innerHTML = `<div class="flex flex-wrap items-baseline gap-x-2 px-1 mb-1">
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-resa-700">Resumen del día</h3>
        <span class="text-[11px] text-stone-500">${dayVal.slice(8,10)}/${dayVal.slice(5,7)}/${dayVal.slice(0,4)} · ${prog.length} ${prog.length === 1 ? 'ruta' : 'rutas'}</span></div>
      <div class="bg-white rounded-lg border border-stone-200 overflow-auto max-h-44">${prog.length ? `<table class="w-full text-[11px] leading-tight text-stone-700"><thead><tr>${TH.map((h, i) =>
        `<th class="sticky top-0 z-10 px-2 py-1 text-left font-semibold uppercase tracking-wide whitespace-nowrap ${i > 9 ? 'bg-eco-100 text-resa-800' : 'bg-stone-100 text-stone-500'}">${h}</th>`).join('')}</tr></thead>
        <tbody>${prog.map(r => `<tr class="odd:bg-white even:bg-stone-50/60">${td(r.route, 'font-bold text-resa-800')}${td(fmt(r.departure).slice(8,10) + '/' + fmt(r.departure).slice(5,7))}${td(r.plate, 'font-semibold')}${td(capOf[plateKey(r.plate)])}
          ${tdt(r.driver)}${tdt(r.ayud1 || '-', 'text-stone-500')}${tdt(r.ayud2 || '-', 'text-stone-500')}${tdt(r.supplier)}${td(r.city)}${td(r.tulas)}${td(hora(r.departure), 'font-bold text-resa-800 bg-eco-50')}${td(r.cargar, 'font-bold text-resa-800 bg-eco-50')}</tr>`).join('')}</tbody></table>`
        : '<p class="px-3 py-2 text-[11px] text-stone-400">No hay rutas programadas para esta fecha.</p>'}</div>`;
  };
  const subDay = () => {                                              // rutas desde la fecha elegida en adelante; viajes desde 7 días antes
    dl.forEach(u => u());
    const a = dayRange($('#day').value)[0], from = Timestamp.fromDate(new Date(+a - 7*864e5));
    dl = [onSnapshot(query(col('routes'), where('departure','>=',a)), s => { routes = rows(s).filter(r => !r.schedStatus); draw(); }),
          onSnapshot(query(col('trips'), where('createdAt','>=',from)), s => { trips = rows(s); draw(); })];
  };
  $('#day').onchange = subDay;
  const tick = setInterval(draw, 30000);                              // refresca las alertas con el paso del tiempo
  unsubs.push(() => dl.forEach(u => u()), () => clearInterval(tick));
  unsubs.push(onSnapshot(query(col('trips'), where('status','==','active')), s => { active = rows(s); draw(); }));
  unsubs.push(onSnapshot(col('statuses'), s => { sts = rows(s).sort((x, y) => x.order - y.order); draw(); }));
  unsubs.push(onSnapshot(col('trucks'), s => { trk = rows(s); draw(); }));
  subDay();
}

/* ============ 6. INFORME POR RUTA ============
   Une el histórico real (báscula + sistema de programación, colección "history")
   con lo que marca el chofer en la app (colección "trips"), cruzando por número de ruta. */
const norm = s => String(s ?? '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const plateKey = s => norm(s).replace(/[^A-Z0-9]/g, '');
const sameName = (a, b) => {                                          // "XAVIER HEREDIA" = "HEREDIA VERA WASHINGTON XAVIER"
  const A = new Set(norm(a).match(/[A-Z]+/g) || []), B = new Set(norm(b).match(/[A-Z]+/g) || []);
  if (!A.size || !B.size) return false;
  const [s, l] = A.size <= B.size ? [A, B] : [B, A], n = [...s].filter(x => l.has(x)).length;
  return n === s.size || n >= 3;
};
const mins = (a, b) => a && b ? (b - a) / 6e4 : null;                // minutos entre dos Timestamp
const dur = m => m == null ? '—' : Math.abs(m) < 90 ? `${Math.round(m)} min` : `${(m/60).toFixed(1)} h`;
const dm = t => { if (!t) return '—'; const s = fmt(t); return `${s.slice(8,10)}/${s.slice(5,7)} ${s.slice(11,16)}`; };
const kg = n => n == null ? '—' : Number(n).toLocaleString('es-EC');
const avg = a => { a = a.filter(x => x != null); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; };
const med = a => { a = a.filter(x => x != null).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2; };
const pc = (n, d) => d ? Math.round(n / d * 100) + '%' : '—';

function calcRoute(h, trip) {
  const r = {...h, trip}, t = trip?.ts || {};
  r.pesoEstado = !(h.pesoSb > 0) ? 'sin' : !(h.pesoAsesor > 0) ? 'ok' : h.pesoSb / h.pesoAsesor < .85 ? 'bajo' : h.pesoSb / h.pesoAsesor > 1.15 ? 'sobre' : 'ok';
  r.cum = r.pesoEstado !== 'sin' && h.pesoAsesor > 0 ? h.pesoSb / h.pesoAsesor * 100 : null;   // peso real / peso prometido
  r.dif = h.pesoSb - h.pesoAsesor;
  r.sinSalida = !h.fechaSalida;
  r.cicloMin = mins(h.fechaSalida, h.fechaSB);                         // salida de planta → báscula en planta
  r.retrasoMin = mins(h.fechaAsignada, h.fechaSalida);                 // + salió tarde · − salió antes de lo programado
  r.demoraRutaH = mins(h.fechaGeneraSolic, h.fechaGeneraRuta) / 60 || null;
  r.antelacionH = mins(h.fechaGeneraRuta, h.fechaAsignada) / 60 || null;
  r.placaOk = plateKey(h.placa) === plateKey(h.placaSB);
  r.choferOk = sameName(h.chofer, h.choferSB);
  r.reprog = !!(h.fechaSolicitada && h.fechaAsignada && +h.fechaSolicitada !== +h.fechaAsignada);
  r.s = Array.from({length: NSTEP}, (_, i) => t['s'+(i+1)] || null);   // estados marcados por el chofer (índice 0 = salida de planta … 6 = camión descargado)
  r.loadPct = trip?.loadPct ?? null;
  r.novedades = trip?.novedades ?? null;
  r.tIda = mins(h.fechaSalida || r.s[0], r.s[1]);                      // planta → proveedor
  r.tProv = mins(r.s[1], r.s[3]);                                      // permanencia en bodega del proveedor
  r.tCarga = mins(r.s[2], r.s[3]);                                     // cargando material → salida del proveedor
  r.tTransito = mins(r.s[3], r.s[4]);                                  // salida proveedor → llegada a planta
  r.tDescarga = h.fechaSBSalida ? mins(h.fechaSB, h.fechaSBSalida) : mins(r.s[5], r.s[6]);   // báscula ingreso → báscula salida; si no existe, descargando material → camión descargado (app)
  r.desfase = mins(r.s[4], h.fechaSB);                                 // llegada según chofer vs báscula
  return r;
}
const tc = s => String(s ?? '').toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()).replace(/S\.a\./g, 'S.A.');
const ESTADOS = ['Completada', 'Sin peso en báscula', 'Sin hora de salida'];
const estadoOf = r => r.pesoEstado === 'sin' ? ESTADOS[1] : r.sinSalida ? ESTADOS[2] : ESTADOS[0];

function reportView() {
  const inp = 'w-full border border-stone-300 rounded-lg px-3 py-2 bg-white';

      <button id="rx" class="${B} bg-resa-600 text-white hover:bg-resa-700 !py-2">Descargar CSV</button>
    </div>
  </div>
  <div id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4"></div>
  <div id="tbl" class="bg-white rounded-xl shadow overflow-x-auto"></div>
  <p class="text-xs text-stone-500 mt-2">Haz clic en una ruta para ver el detalle. Salida de planta, báscula y pesos vienen del sistema de la empresa; los tiempos de carga y descarga y el volumen de carga los registra el chofer en la app (en esta demo, los de las rutas del Excel están simulados).</p>`;

  let hist = [], trips = [], rows = [], open = new Set(), ready = false;
  const rowsOf = s => s.docs.map(d => ({id: d.id, ...d.data()}));
  const pill = (t, c) => `<span class="inline-block rounded-md px-2 py-0.5 text-sm font-semibold ${c}">${t}</span>`;
  const none = '<span class="text-stone-300">—</span>';

  const draw = () => {
    if (!hist.length) { $('#tbl').innerHTML = '<p class="p-4 text-stone-500">Aún no hay histórico cargado.</p>'; return; }
    if (!ready) {                                                        // rango inicial = lo que hay en el histórico

    const [a, b] = [dayRange($('#rf').value)[0], dayRange($('#rt').value)[1]], q = norm($('#rq').value.trim()), est = $('#re').value;
    rows = hist.map(h => calcRoute(h, byRoute.get(String(h.ruta))))

      .filter(r => !est || estadoOf(r) === est)

    // ---- resumen corto ----
    const wp = rows.filter(r => r.pesoEstado !== 'sin'), sumP = wp.reduce((s, r) => s + r.pesoAsesor, 0), sumR = wp.reduce((s, r) => s + r.pesoSb, 0);
    const conRet = rows.map(r => r.retrasoMin).filter(x => x != null);

      K('Salieron a tiempo', pc(conRet.filter(x => x <= 15).length, conRet.length), 'hasta 15 min de retraso')

    // ---- tabla: ruta · salida · proveedor · placa · chofer · estado ----
    const th = 'px-4 py-3 text-left font-semibold whitespace-nowrap', td = 'px-4 py-3 whitespace-nowrap';
    const body = rows.map(r => {
      const ok = estadoOf(r) === ESTADOS[0], isOpen = open.has(r.id);

        <td class="${td}">${esc(r.placaSB)}</td>

    }).join('');
    $('#tbl').innerHTML = rows.length ? `<table class="w-full">

      <tbody>${body}</tbody></table>` : '<p class="p-4 text-stone-500">No hay rutas con esos filtros.</p>';
  };

  /* Detalle: fechas registradas (izquierda) · DATOS: tiempos, volumen de carga y peso prometido vs báscula (derecha) */
  const detail = r => {
    const card = (t, inner) => `<div class="bg-white rounded-xl border border-stone-200 p-4"><p class="text-xs font-semibold uppercase tracking-wide text-stone-500 mb-3">${t}</p>${inner}</div>`;

    const li = (l, v) => `<div class="flex justify-between gap-3 py-1.5 border-b border-stone-100 last:border-0 text-sm"><span class="text-stone-500">${l}</span><span class="font-medium text-right">${v}</span></div>`;
    const tm = (l, v, hint) => `<div title="${hint}"><p class="text-xs text-stone-500">${l}</p><p class="text-lg font-bold leading-tight">${v ?? '<span class="text-sm font-normal text-stone-400">Sin dato</span>'}</p></div>`;

    const ev = [['Salida de planta', r.fechaSalida || r.s[0]], ['Llegada a bodega del proveedor', r.s[1]], ['Cargando material', r.s[2]], ['Salida de bodega del proveedor', r.s[3]],
      ['Llegada a planta', r.s[4]], ['Peso en báscula (ingreso)', r.fechaSB], ['Peso en báscula (salida)', r.fechaSBSalida],
      ['Descargando material', r.s[5]], ['Camión descargado', r.s[6]]];

    // barras de peso: misma escala para las dos
    const max = Math.max(r.pesoAsesor, r.pesoSb, 1), w = v => Math.round(v / max * 100);
    const col = {ok: 'bg-eco-500', bajo: 'bg-amber-500', sobre: 'bg-violet-500', sin: 'bg-red-400'}[r.pesoEstado];
    const bar = (l, v, c) => `<div class="flex items-center gap-2 mb-1.5"><span class="w-24 shrink-0 text-xs text-stone-600">${l}</span>
      <div class="flex-1 h-3 bg-stone-100 rounded-full overflow-hidden"><div class="h-3 rounded-full ${c}" style="width:${w(v)}%"></div></div><b class="w-20 text-right text-sm">${kg(v)} kg</b></div>`;
    const resumen = r.pesoEstado === 'sin' ? 'La báscula no registró peso.'
      : `${r.cum == null ? '' : Math.round(r.cum) + '% de lo prometido · '}${r.dif >= 0 ? 'sobraron' : 'faltaron'} ${kg(Math.abs(r.dif))} kg`;

    const prog = (!r.placaOk || !r.choferOk) ? `<p class="text-sm text-stone-500 mt-4">Programado originalmente: ${!r.placaOk ? `placa <b>${esc(r.placa)}</b>` : ''}${!r.placaOk && !r.choferOk ? ' · ' : ''}${!r.choferOk ? `chofer <b>${esc(tc(r.chofer))}</b>` : ''}</p>` : '';

    const datos = `${sub('Tiempos calculados')}
      <div class="grid grid-cols-3 gap-3 pb-3 border-b border-stone-100">
        ${tm('Tiempo en ruta', r.cicloMin != null ? dur(r.cicloMin) : null, 'Salida de planta → llegada a planta (báscula)')}
        ${tm('Tiempo de descarga camión', r.tDescarga != null ? dur(r.tDescarga) : null, 'Báscula ingreso → báscula salida (o descargando material → camión descargado, según el chofer)')}
        ${tm('Tiempo de carga proveedor', r.tCarga != null ? dur(r.tCarga) : null, 'Cargando material → salida de bodega del proveedor')}</div>
      <div class="py-3 border-b border-stone-100">${sub('Volumen de carga (chofer)')}${r.loadPct != null
        ? `<div class="flex items-center gap-3"><b class="text-lg w-14">${r.loadPct}%</b><div class="flex-1 h-3 bg-stone-100 rounded-full overflow-hidden"><div class="h-3 rounded-full bg-resa-500" style="width:${Math.min(r.loadPct, 100)}%"></div></div></div>`
        : '<p class="text-sm text-stone-400">El chofer aún no lo registró.</p>'}</div>
      <div class="py-3 border-b border-stone-100">${sub('Novedades (chofer)')}${r.novedades
        ? `<p class="text-sm ${r.novedades === 'Sin novedades' ? 'text-stone-600' : 'text-amber-700 font-semibold'}">${esc(r.novedades)}</p>`
        : '<p class="text-sm text-stone-400">El chofer aún no las registró.</p>'}</div>
      <div class="pt-3">${sub('Peso prometido vs báscula')}${bar('Prometido', r.pesoAsesor, 'bg-stone-400')}${bar('Báscula', r.pesoSb, col)}
        <p class="text-sm font-semibold mt-2 ${r.pesoEstado === 'ok' ? 'text-eco-700' : 'text-amber-700'}">${resumen}</p></div>`;

    return `<div class="grid gap-4 md:grid-cols-2 items-start">
      ${card('Fechas y horas registradas', ev.map(([l, t]) => li(l, t ? dm(t) : '<span class="text-stone-300">Sin dato</span>')).join(''))}
      ${card('Datos', datos)}
      </div>${prog}`;
  };

  const csv = () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, n = v => v == null ? '' : Math.round(v * 10) / 10;
    const head = ['Ruta','Numsb','Proveedor','Estado','Placa_programada','Placa_bascula','Chofer_programado','Chofer_bascula','Generacion_solicitud','Solicitada_para','Ruta_generada','Asignada_para',
      'Salida_planta','Llego_proveedor_app','Cargando_material_app','Salio_proveedor_app','Carga_pct_app','Llegada_planta_app','Bascula','Descargando_app','Descargado_app','Novedades_app','Retraso_salida_min','Tiempo_en_ruta_h',
      'Peso_prometido_kg','Peso_real_kg','Diferencia_kg','Cumplimiento_pct'];
    const out = [head, ...rows.map(r => [r.ruta, r.numsb, r.proveedor, estadoOf(r), r.placa, r.placaSB, r.chofer, r.choferSB, fmt(r.fechaGeneraSolic), fmt(r.fechaSolicitada), fmt(r.fechaGeneraRuta), fmt(r.fechaAsignada),
      fmt(r.fechaSalida || r.s[0]), fmt(r.s[1]), fmt(r.s[2]), fmt(r.s[3]), r.loadPct, fmt(r.s[4]), fmt(r.fechaSB), fmt(r.s[5]), fmt(r.s[6]), r.novedades, n(r.retrasoMin), r.cicloMin == null ? '' : n(r.cicloMin / 60),
      r.pesoAsesor, r.pesoSb, r.dif, n(r.cum)])];
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob(['﻿' + out.map(x => x.map(q).join(',')).join('\n')], {type: 'text/csv;charset=utf-8'})),
      download: `informe_rutas_${$('#rf').value}_${$('#rt').value}.csv` });
    a.click();
  };

  ['#rf', '#rt', '#re'].forEach(s => $(s).onchange = draw);
  $('#rq').oninput = draw; $('#rx').onclick = csv;
  $('#tbl').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) { open.has(tr.dataset.id) ? open.delete(tr.dataset.id) : open.add(tr.dataset.id); draw(); } };
  unsubs.push(onSnapshot(col('history'), s => { hist = rowsOf(s); draw(); }));
  unsubs.push(onSnapshot(col('trips'), s => { trips = rowsOf(s); draw(); }));
}

/* CRUD genérico: statuses y users (rutas, placas y solicitudes se cargan desde el Excel) */
const CFG = {
  statuses: {title:'Catálogo de estados', sort:'order', f:[['name','Nombre del estado'],['order','Orden (1-7)','number'],['askLoad','Pedir % de volumen cargado al marcarlo','check'],['askNotes','Pedir novedades al marcarlo','check']]},

/* ============ CALENDARIO SEMANAL (solo visual) ============
   Matriz placa × día (lunes a sábado; el domingo aparece solo si ese día hay rutas). Cada celda lista TODAS las rutas programadas de esa
   placa ese día: #ruta, proveedor, ciudad y estado. A la derecha: solicitudes pendientes por asignar (todavía sin número de ruta).
   Estado de cada ruta: CANCELADO / REAGENDADO vienen del campo schedStatus de la ruta; si no, se deduce del viaje del chofer
   (terminado = REALIZADO, abierto = EN CURSO) y, sin viaje, queda PROGRAMADO (o SIN REGISTRO si el día ya pasó). */
const CAL_DAYS = ['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO','DOMINGO'];
const HOLIDAYS = {'2026-11-02':'Día de Difuntos','2026-11-03':'Independencia de Cuenca','2026-12-25':'Navidad','2027-01-01':'Año Nuevo'};
const CAL_EST = {
  'REALIZADO':    {bar:'border-eco-500',   bg:'bg-eco-50',   tx:'text-eco-700',   dot:'bg-eco-500'},
  'EN CURSO':     {bar:'border-resa-500',  bg:'bg-resa-50',  tx:'text-resa-700',  dot:'bg-resa-500'},
  'PROGRAMADO':   {bar:'border-stone-300', bg:'bg-stone-50', tx:'text-stone-500', dot:'bg-stone-300'},
  'CANCELADO':    {bar:'border-red-500',   bg:'bg-red-50',   tx:'text-red-700',   dot:'bg-red-500'},
  'REAGENDADO':   {bar:'border-amber-500', bg:'bg-amber-50', tx:'text-amber-700', dot:'bg-amber-500'},
  'SIN REGISTRO': {bar:'border-stone-400', bg:'bg-white',    tx:'text-stone-400', dot:'bg-stone-400'}
};
function calendarView() {
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const dmy = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
  const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
  const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7); };
  const parseDay = s => new Date(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10));
  let week = mondayOf(new Date());
  const D = {routes: [], trips: [], trucks: [], reqs: []};

  $('#content').innerHTML = `
    <div class="flex flex-wrap items-end justify-between gap-3 mb-3">
      <div><h2 class="text-xl font-bold text-resa-800">Calendario semanal</h2><p id="wk" class="text-sm text-stone-500"></p></div>
      <div class="flex flex-wrap items-end gap-2">
        <button id="prev" class="${B} !py-2 bg-white border border-stone-300 hover:bg-stone-100">‹ Anterior</button>
        <button id="today" class="${B} !py-2 bg-resa-600 text-white hover:bg-resa-700">Hoy</button>
        <button id="next" class="${B} !py-2 bg-white border border-stone-300 hover:bg-stone-100">Siguiente ›</button>
        <label class="text-xs text-stone-500">Ir a la semana de<input id="jump" type="date" class="${INP} !py-2"></label>
        <label class="text-xs text-stone-500">Buscar<input id="q" placeholder="Placa, ruta, proveedor, ciudad…" class="${INP} !py-2"></label>
      </div>
    </div>
    <div id="sum" class="flex flex-wrap gap-2 mb-3 text-xs"></div>
    <div id="calwrap" class="grid gap-4 xl:grid-cols-[minmax(0,1fr)_21rem] items-start">
      <div id="grid" class="bg-white rounded-xl shadow overflow-x-auto xl:overflow-visible"></div>
      <aside id="pend" class="bg-white rounded-xl shadow"></aside>
    </div>`;

  const draw = () => {
    if (!$('#grid')) return;
    const todayKey = ymd(new Date()), q = norm($('#q').value.trim());
    const weekKeys = Array.from({length: 7}, (_, i) => ymd(addDays(week, i)));
    const tripOf = new Map();
    D.trips.forEach(t => { const p = tripOf.get(t.routeId); if (!p || +t.createdAt > +p.createdAt) tripOf.set(t.routeId, t); });
    const estOf = (r, key) => {
      if (r.schedStatus === 'cancelado') return 'CANCELADO';
      if (r.schedStatus === 'reagendado') return 'REAGENDADO';
      const t = tripOf.get(r.id);
      return t ? (t.status === 'done' ? 'REALIZADO' : 'EN CURSO') : key < todayKey ? 'SIN REGISTRO' : 'PROGRAMADO';
    };

    // rutas de la semana visible, agrupadas por placa y día
    const cell = new Map(), weekRoutes = [];
    D.routes.forEach(r => {
      if (!r.departure) return;
      const key = fmt(r.departure).slice(0,10);
      if (!weekKeys.includes(key)) return;
      const x = {...r, key, est: estOf(r, key)};
      weekRoutes.push(x);
      const ck = plateKey(r.plate) + '|' + key;
      cell.set(ck, [...(cell.get(ck) || []), x]);
    });
    const hasSun = weekRoutes.some(r => r.key === weekKeys[6]);
    const keys = weekKeys.slice(0, hasSun ? 7 : 6);
    // El domingo solo aparece si ese día hay rutas. Con 7 columnas la tabla es más ancha: el panel de solicitudes pasa debajo
    // hasta pantallas muy anchas (2xl) para que la tabla no se salga de su tarjeta ni quede tapada.
    $('#calwrap').className = 'grid gap-4 items-start ' + (hasSun ? '2xl:grid-cols-[minmax(0,1fr)_21rem]' : 'xl:grid-cols-[minmax(0,1fr)_21rem]');
    $('#grid').className = 'bg-white rounded-xl shadow overflow-x-auto ' + (hasSun ? '2xl:overflow-visible' : 'xl:overflow-visible');

    // placas: toda la flota (como en la hoja de ejemplo), ordenadas por capacidad; más las que aparezcan en rutas sin estar registradas
    const fleet = new Map();
    D.trucks.forEach(t => fleet.set(plateKey(t.plate), {plate: t.plate, cap: t.cap}));
    weekRoutes.forEach(r => { if (!fleet.has(plateKey(r.plate))) fleet.set(plateKey(r.plate), {plate: r.plate}); });
    const plates = [...fleet.entries()].sort((a, b) => (b[1].cap ?? -1) - (a[1].cap ?? -1) || a[1].plate.localeCompare(b[1].plate));

    const hit = (r, plateTxt) => !q || norm([r.route, r.plate, r.driver, r.supplier, r.city, r.est, plateTxt].join(' ')).includes(q);
    const chip = r => { const e = CAL_EST[r.est], hh = fmt(r.departure).slice(11,16);
      return `<div class="rounded-md border-l-4 ${e.bar} ${e.bg} px-2 py-1 text-[11px] leading-tight shadow-sm" title="Ruta ${esc(r.route)} · ${esc(r.supplier)} · ${esc(r.city || 'Sin ciudad')} · ${hh} · ${r.est}">
        <div class="flex items-center justify-between gap-1"><b class="text-xs text-stone-800">#${esc(r.route)}</b><span class="text-[9px] font-bold tracking-wide ${e.tx}">${r.est}</span></div>
        <div class="truncate font-semibold text-stone-700 ${r.est === 'CANCELADO' ? 'line-through opacity-70' : ''}">${esc(r.supplier)}</div>
        <div class="flex justify-between gap-1 text-stone-500"><span class="truncate">${esc(r.city || 'Sin ciudad')}</span><span class="shrink-0 text-stone-400">${hh}</span></div></div>`; };

    const th = 'sticky top-0 z-10 bg-resa-700 text-white';
    const head = `<tr><th class="${th} left-0 z-20 text-left px-3 py-2">PLACA</th>${keys.map((k, i) => { const d = parseDay(k), hol = HOLIDAYS[k];
      return `<th class="${th} px-2 py-2 ${k === todayKey ? 'shadow-[inset_0_-4px_0_#90c14e]' : ''}">
        <div class="text-[11px] font-semibold opacity-80">${dmy(d)}</div><div class="text-sm font-bold tracking-wide">${CAL_DAYS[i]}</div>
        ${hol ? `<div class="mt-0.5 inline-block rounded bg-red-200 px-1.5 text-[10px] font-bold text-red-800" title="${esc(hol)}">FERIADO</div>` : ''}</th>`; }).join('')}</tr>`;

    let shown = 0;
    const body = plates.map(([pk, p]) => {
      const mine = keys.flatMap(k => cell.get(pk + '|' + k) || []);
      const plateHit = !q || norm(p.plate).includes(q);
      if (q && !plateHit && !mine.some(r => hit(r))) return '';
      shown++;
      const drivers = [...new Set(mine.map(r => r.driver).filter(Boolean))];
      const tds = keys.map(k => { const rs = (cell.get(pk + '|' + k) || []).filter(r => plateHit || hit(r)).sort((a, b) => +a.departure - +b.departure), hol = HOLIDAYS[k];
        return `<td class="align-top p-1.5 border-l border-stone-100 ${hol ? 'bg-red-50/70' : k === todayKey ? 'bg-resa-50/50' : ''}">

        <div class="font-bold text-stone-800">${esc(p.plate)}${p.cap != null ? ` <span class="ml-1 whitespace-nowrap rounded bg-resa-100 px-1.5 py-0.5 text-[10px] font-bold text-resa-800">${p.cap} TM</span>` : ''}</div>
        <div class="max-w-[9rem] truncate text-[11px] text-stone-500" title="${esc(drivers.join(' / '))}">${esc(drivers.join(' / ')) || '—'}</div></th>${tds}</tr>`;
    }).join('');
    $('#grid').innerHTML = `<table class="w-full table-fixed border-collapse" style="min-width:${10.5 + keys.length * 7.5}rem"><colgroup><col style="width:10.5rem"></colgroup><thead>${head}</thead><tbody>${body}</tbody></table>${shown ? '' : '<p class="p-6 text-center text-stone-400">Ninguna placa coincide con la búsqueda.</p>'}`;

    // encabezado de semana + resumen por estado (sirve también de leyenda)
    const end = addDays(week, hasSun ? 6 : 5);
    $('#wk').textContent = `Semana del ${dmy(week)}/${week.getFullYear()} al ${dmy(end)}/${end.getFullYear()} · SEM ${isoWeek(week)}`;
    const count = e => weekRoutes.filter(r => r.est === e).length, pill = (dot, label, n) =>
      `<span class="inline-flex items-center gap-1.5 rounded-full border border-stone-200 bg-white px-2.5 py-1"><span class="h-2.5 w-2.5 rounded-full ${dot}"></span>${label} <b>${n}</b></span>`;

      + (count('SIN REGISTRO') ? pill(CAL_EST['SIN REGISTRO'].dot, 'SIN REGISTRO', count('SIN REGISTRO')) : '');

    // solicitudes pendientes: las que aún no tienen número de ruta
    const today0 = parseDay(todayKey), pending = D.reqs.filter(r => !r.route && r.requestedFor).sort((a, b) => +a.requestedFor - +b.requestedFor);
    const SHORT = ['dom','lun','mar','mié','jue','vie','sáb'];
    $('#pend').innerHTML = `<div class="flex items-center justify-between gap-2 border-b border-stone-200 px-4 py-3">
        <div><h3 class="font-bold text-resa-800">Solicitudes pendientes</h3><p class="text-xs text-stone-500">Por asignar · sin número de ruta</p></div>
        <span class="rounded-full bg-amber-100 px-2.5 py-1 text-sm font-bold text-amber-800">${pending.length}</span></div>
      <div class="divide-y divide-stone-100">${pending.map(r => {
        const k = fmt(r.requestedFor).slice(0,10), d = parseDay(k), hh = fmt(r.requestedFor).slice(11,16), diff = Math.round((d - today0) / 864e5), inWeek = weekKeys.includes(k);
        const rel = diff < 0 ? `Vencida hace ${-diff} d` : diff === 0 ? 'Hoy' : diff === 1 ? 'Mañana' : `En ${diff} d`;
        return `<div class="px-4 py-3 ${inWeek ? 'border-l-4 border-resa-400 bg-resa-50/60' : 'border-l-4 border-transparent'}">
          <div class="flex items-start justify-between gap-2"><b class="text-sm leading-tight">${esc(r.supplier)}</b>${r.tons != null ? `<span class="shrink-0 rounded bg-resa-100 px-1.5 py-0.5 text-[11px] font-bold text-resa-800">${r.tons} TM</span>` : ''}</div>
          <div class="text-xs text-stone-500">${esc(r.city || 'Sin ciudad')}</div>
          <div class="mt-1 flex justify-between gap-2 text-xs"><span>Para: <b>${SHORT[d.getDay()]} ${dmy(d)}${hh !== '00:00' ? ' ' + hh : ''}</b></span>
            <span class="${diff < 0 ? 'font-bold text-red-600' : 'text-stone-400'}">${rel}</span></div></div>`; }).join('')
        || '<p class="px-4 py-6 text-center text-sm text-stone-400">No hay solicitudes pendientes.</p>'}</div>`;
  };

  const go = d => { week = mondayOf(d); $('#jump').value = ''; draw(); };
  $('#prev').onclick = () => go(addDays(week, -7));
  $('#next').onclick = () => go(addDays(week, 7));
  $('#today').onclick = () => go(new Date());
  $('#jump').onchange = e => { if (e.target.value) go(parseDay(e.target.value)); };
  $('#q').oninput = draw;
  const rows = s => s.docs.map(d => ({id: d.id, ...d.data()}));
  unsubs.push(onSnapshot(col('routes'),   s => { D.routes = rows(s); draw(); }));
  unsubs.push(onSnapshot(col('trips'),    s => { D.trips  = rows(s); draw(); }));
  unsubs.push(onSnapshot(col('trucks'),   s => { D.trucks = rows(s); draw(); }));
  unsubs.push(onSnapshot(col('requests'), s => { D.reqs   = rows(s); draw(); }));
}

        .filter(Boolean).join(' · ')}</span>

      <button data-d="${r.id}" class="text-red-600 underline">Eliminar</button></span></div>`).join('')
      || '<p class="p-3 text-stone-500">Sin registros.</p>';
    $('#list').onclick = async e => {
      const r = rows.find(x => x.id === (e.target.dataset.e || e.target.dataset.d));
      if (e.target.dataset.e) { editId = r.id; cf.f.forEach(([k,,t]) => { const el = form.elements[k];
        t === 'check' ? el.checked = !!r[k] : el.value = t === 'datetime-local' ? loc(r[k]) : (r[k] ?? ''); }); }
      if (e.target.dataset.d && confirm('¿Eliminar este registro?')) await deleteDoc(doc(db, c, r.id));

/* ============ 7. IMPORTAR EXCEL ============
   Lee la hoja "Rutas" (formato de rutas_variables_demo.xlsx: una fila por ruta, ID = "Ruta (ID)") y REEMPLAZA toda la información:
   rutas, viajes del chofer, histórico de báscula, placas y solicitudes. Se conservan los usuarios y los estados.
   Solo se leen las columnas de datos; las columnas "calculadas" del Excel se ignoran porque la app las recalcula.
   Las fechas del Excel se interpretan en hora de Ecuador (UTC-5). */
const IMP = {route:'Ruta (ID)', fecha:'Fecha ruta', plate:'Placa', cap:'Ton', driver:'Chofer', ayud1:'Ayudante 1', ayud2:'Ayudante 2', supplier:'Proveedor', city:'Ciudad',
  tulas:'Tulas', hora:'Hora salida', cargar:'Cargar (kg)',   // ← mismo orden que el resumen del día de Flota estado
  departure:'Salida programada', sched:'Estado agendado', rsim:'Ruta simulada', numsb:'N° báscula', fsolic:'Generación de solicitud', fsolicitada:'Fecha solicitada',
  fgenruta:'Generación de ruta', fasig:'Fecha asignada', placa_asig:'Placa asignada (sistema)', chofer_asig:'Chofer asignado (sistema)',
  fsalida:'Salida de planta (sistema)', placaSB:'Placa en báscula', choferSB:'Chofer en báscula', fsb:'Báscula ingreso', fsbs:'Báscula salida',
  pesoSb:'Peso báscula (kg)', pesoAs:'Peso prometido asesor (kg)', user:'Usuario del chofer', tsim:'Viaje simulado', tstatus:'Estado del viaje',
  step:'Etapa actual (0-7)', tdep:'Salida registrada en el viaje', created:'Inicio del viaje', finished:'Fin del viaje', load:'% de volumen cargado', nov:'Novedades'};
const IMP_ALIAS = {plate:['Placa (ruta/app)'], driver:['Chofer (ruta/app)'], cap:['Capacidad camión (TM)']};   // nombres de la versión anterior del Excel
const IMP_REQ = ['route', 'plate'];   // además: "Fecha ruta" (con "Hora salida") o, en archivos antiguos, "Salida programada"
const nkey = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

function parseExcel(buf) {
  if (typeof XLSX === 'undefined') throw new Error('No se pudo cargar la librería de Excel (SheetJS). Revisa tu conexión a internet y recarga la página.');
  const wb = XLSX.read(buf, {type: 'array'});
  const ws = wb.Sheets['Rutas'] || wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, {header: 1, defval: null, raw: true});
  if (raw.length < 2) throw new Error('La hoja está vacía: no hay filas de rutas.');
  const heads = raw[0].map(nkey), col = {};
  for (const [k, h] of Object.entries(IMP)) { const i = [h, ...(IMP_ALIAS[k] || [])].map(nkey).map(x => heads.indexOf(x)).find(x => x >= 0); if (i >= 0) col[k] = i; }
  for (let n = 1; n <= NSTEP; n++) { const i = heads.findIndex(h => h.startsWith(n + '.')); if (i >= 0) col['s' + n] = i; }   // "1. Salida de planta" … "7. Camión descargado"
  const miss = IMP_REQ.filter(k => !(k in col)).map(k => IMP[k]); if (!('fecha' in col) && !('departure' in col)) miss.push(IMP.fecha);
  if (miss.length) throw new Error('Faltan columnas obligatorias: ' + miss.join(', ') + '. Usa el formato de la tabla "Rutas" del Excel.');

  const errs = [], seen = new Set(), routes = {}, trips = {}, history = {}, plates = new Map(), OFF = 5 * 36e5;
  const DATEK = ['fecha','departure','fsolic','fsolicitada','fgenruta','fasig','fsalida','fsb','fsbs','tdep','created','finished', ...Array.from({length: NSTEP}, (_, i) => 's' + (i + 1))];
  const g = (r, k) => { const v = k in col ? r[col[k]] : null; if (v == null) return null; if (typeof v === 'string') { const t = v.trim(); return t === '' ? null : t; } return v; };
  const num = v => { if (v == null) return null; const x = typeof v === 'number' ? v : Number(String(v).replace(',', '.')); return Number.isFinite(x) ? x : null; };
  const dt = (r, k, rn) => {
    const v = g(r, k); if (v == null) return null;
    let ms, m;
    if (typeof v === 'number') ms = Math.round(((v - 25569) * 864e5 + OFF) / 1000) * 1000;                       // serial de Excel → instante (hora de Ecuador)
    else { const s = String(v);
      if (/\d{4}-\d\d-\d\d.*(z|[+-]\d\d:?\d\d)$/i.test(s)) ms = Date.parse(s);
      else if (m = s.match(/^(\d{4})-(\d\d)-(\d\d)(?:[T ](\d\d):(\d\d)(?::(\d\d))?)?$/)) ms = Date.UTC(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) + OFF;
      else if (m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d\d)(?::(\d\d))?)?$/)) ms = Date.UTC(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) + OFF;
      else ms = NaN; }
    if (!Number.isFinite(ms)) { errs.push(`Fila ${rn}: fecha no válida en "${raw[0][col[k]]}" (${v}).`); return null; }
    return ms;
  };
  const T0 = ms => ms == null ? null : {__ts: ms};
  const timeOf = v => {   // hora del día en ms: fracción de día de Excel o texto "8:30", "08:30:00", "8:30 a. m."
    if (typeof v === 'number') return Math.round((v % 1) * 86400) * 1000;
    const m = String(v).toLowerCase().replace(/[.\s]/g, '').match(/^(\d{1,2}):(\d\d)(?::(\d\d))?(am|pm)?$/);
    if (!m) return NaN;
    let h = +m[1]; if (m[4] === 'pm' && h < 12) h += 12; if (m[4] === 'am' && h === 12) h = 0;
    return ((h * 60 + +m[2]) * 60 + +(m[3] || 0)) * 1000;
  };

  for (let i = 1; i < raw.length; i++) {
    const r = raw[i], rn = i + 1;
    if (!r || r.every(c => c == null || String(c).trim() === '')) continue;
    const id = g(r, 'route');
    if (id == null) { errs.push(`Fila ${rn}: falta el número de ruta (ID).`); continue; }
    const route = String(id).trim();
    if (seen.has(route)) { errs.push(`Fila ${rn}: la ruta ${route} está repetida (el ID debe ser único).`); continue; }
    seen.add(route);
    const T = {}; DATEK.forEach(k => T[k] = dt(r, k, rn));
    if (T.fecha != null) {   // salida programada = Fecha ruta + Hora salida
      const hv = g(r, 'hora'), hm = hv == null ? null : timeOf(hv);
      if (hm != null && !Number.isFinite(hm)) { errs.push(`Fila ${rn}: hora no válida en \"${raw[0][col.hora]}\" (${hv}).`); continue; }
      T.departure = hm != null ? Math.floor((T.fecha - OFF) / 864e5) * 864e5 + OFF + hm : T.fecha;
    }
    const plate = String(g(r, 'plate') ?? g(r, 'placaSB') ?? g(r, 'placa_asig') ?? '').trim().toUpperCase();
    const dep = T.departure ?? T.fasig;
    if (!plate) { errs.push(`Fila ${rn} (ruta ${route}): falta la placa.`); continue; }
    if (dep == null) { errs.push(`Fila ${rn} (ruta ${route}): falta "${IMP.fecha}" (y "${IMP.hora}").`); continue; }
    const driver = String(g(r, 'driver') ?? g(r, 'choferSB') ?? g(r, 'chofer_asig') ?? '').trim();
    const supplier = String(g(r, 'supplier') ?? '').trim();
    const sched = nkey(g(r, 'sched')), isSim = x => ['si', 'sí', 'true', '1'].includes(nkey(x));
    const rid = 'r' + route.replace(/[^\w-]/g, '_');
    routes[rid] = {route, plate, driver, supplier, city: String(g(r, 'city') ?? '').trim(), departure: T0(dep),
      ...(g(r, 'ayud1') != null ? {ayud1: String(g(r, 'ayud1')).trim()} : {}), ...(g(r, 'ayud2') != null ? {ayud2: String(g(r, 'ayud2')).trim()} : {}),
      ...(num(g(r, 'tulas')) != null ? {tulas: num(g(r, 'tulas'))} : {}), ...(num(g(r, 'cargar')) != null ? {cargar: num(g(r, 'cargar'))} : {}),
      ...(sched.startsWith('cancel') ? {schedStatus: 'cancelado'} : sched.startsWith('reagend') ? {schedStatus: 'reagendado'} : {}),
      ...(isSim(g(r, 'rsim')) ? {simulado: true} : {})};
    const cap = num(g(r, 'cap'));
    if (!plates.has(plate) || (cap != null && plates.get(plate) == null)) plates.set(plate, cap);
    [g(r, 'placa_asig'), g(r, 'placaSB')].forEach(p => { if (p) { const k = String(p).trim().toUpperCase(); if (!plates.has(k)) plates.set(k, null); } });

    // Viaje del chofer (app): existe si hay estado del viaje o alguna hora de etapa
    const st = nkey(g(r, 'tstatus')), stg = [null, ...Array.from({length: NSTEP}, (_, n) => T['s' + (n + 1)])];
    if (st || stg.some(Boolean)) {
      let cnt = 0; while (cnt < NSTEP && stg[cnt + 1]) cnt++;
      for (let n = cnt + 2; n <= NSTEP; n++) if (stg[n]) { errs.push(`Fila ${rn} (ruta ${route}): las etapas del chofer deben llenarse en orden, sin saltarse ninguna.`); break; }
      let step = cnt || num(g(r, 'step')) || 0, status = ['finalizado', 'done', 'completado', 'completada'].includes(st) ? 'done' : ['en curso', 'active'].includes(st) ? 'active' : 'active';
      if (status === 'done' || step >= NSTEP) { status = 'done'; step = NSTEP; }
      const tdep = T.tdep ?? T.fsalida ?? dep, ts = {}; stg.forEach((v, n) => { if (n && v != null) ts['s' + n] = T0(v); });
      const load = num(g(r, 'load')), nov = g(r, 'nov');
      trips['t' + route.replace(/[^\w-]/g, '_')] = {routeId: rid, route, plate, driver, supplier, username: String(g(r, 'user') ?? driver),
        departure: T0(tdep), currentStep: step, status, createdAt: T0(T.created ?? tdep),
        ...(status === 'done' ? {finishedAt: T0(T.finished ?? stg[NSTEP] ?? null)} : {}),
        ...(load != null ? {loadPct: load} : {}), ...(nov != null ? {novedades: String(nov)} : {}), ts,
        ...(isSim(g(r, 'tsim')) ? {simulado: true} : {})};
    }

    // Histórico del sistema / báscula: existe si hay N° de báscula, fecha de báscula, fecha asignada o peso
    if (g(r, 'numsb') != null || T.fsb != null || T.fasig != null || num(g(r, 'pesoSb')) != null) {
      history['h' + route.replace(/[^\w-]/g, '_')] = {ruta: Number.isFinite(+route) ? +route : route, numsb: String(g(r, 'numsb') ?? ''), proveedor: supplier,
        fechaSB: T0(T.fsb), placaSB: String(g(r, 'placaSB') ?? ''), choferSB: String(g(r, 'choferSB') ?? ''),
        placa: String(g(r, 'placa_asig') ?? plate), chofer: String(g(r, 'chofer_asig') ?? driver),
        pesoSb: num(g(r, 'pesoSb')) ?? 0, pesoAsesor: num(g(r, 'pesoAs')) ?? 0,
        fechaSalida: T0(T.fsalida), fechaGeneraSolic: T0(T.fsolic), fechaSolicitada: T0(T.fsolicitada ?? T.fasig), fechaGeneraRuta: T0(T.fgenruta),
        fechaAsignada: T0(T.fasig ?? dep), fechaSBSalida: T0(T.fsbs)};
    }
  }
  if (!Object.keys(routes).length && !errs.length) errs.push('No se encontró ninguna fila de ruta en la hoja.');
  const trucks = Object.fromEntries([...plates].sort().map(([plate, cap], i) => ['p' + i, cap != null ? {plate, cap} : {plate}]));
  return {routes, trips, history, trucks, errs};
}

function applyImport(P) {
  DB = {users: DB.users || {}, statuses: DB.statuses || {}, trucks: P.trucks, routes: P.routes, trips: P.trips, history: P.history, requests: {}};
  Object.keys(localStorage).filter(k => k.startsWith('trip_')).forEach(k => localStorage.removeItem(k));   // viajes en curso de choferes: ya no existen
  persist();
}

function importView() {
  $('#content').innerHTML = `<h2 class="text-xl font-bold mb-1 text-resa-800">Importar Excel</h2>
    <p class="text-sm text-stone-600 mb-4 max-w-3xl">Sube el Excel con la tabla <b>Rutas</b> (una fila por ruta, ID = <b>Ruta (ID)</b>). Cada vez que subes un archivo
      <b>se reemplaza toda la información</b> de la página (rutas, viajes del chofer, histórico de báscula, placas y solicitudes) por lo que trae el Excel. Los usuarios y los estados se conservan.</p>
    <label class="block max-w-xl cursor-pointer rounded-xl border-2 border-dashed border-resa-300 bg-white p-6 text-center hover:bg-resa-50">
      <span class="block font-semibold text-resa-700">Elegir archivo Excel (.xlsx)</span>
      <span class="block text-xs text-stone-500 mt-1">o arrástralo aquí</span>
      <input id="ifile" type="file" accept=".xlsx,.xlsm,.xls" class="hidden">
    </label>
    <div id="imsg" class="mt-4 max-w-3xl"></div>
    <details class="mt-4 max-w-3xl text-sm text-stone-600"><summary class="cursor-pointer font-semibold text-resa-700">Columnas que se leen</summary>
      <p class="mt-2"><b>Obligatorias:</b> ${IMP.route}, ${IMP.plate}, ${IMP.fecha} (con ${IMP.hora}; si no hay hora se toma la de la fecha).</p>
      <p class="mt-1"><b>Opcionales:</b> ${IMP.hora}, ${Object.entries(IMP).filter(([k]) => ![...IMP_REQ, 'fecha', 'hora', 'departure'].includes(k)).map(([, h]) => h).join(', ')}; la hora de salida también puede venir en "${IMP.departure}" (fecha y hora juntas), y las 7 etapas del chofer ("1. …" a "7. …").</p>
      <p class="mt-1">Las columnas calculadas (estado del peso, tiempos, cumplimiento, etc.) se ignoran: la página las recalcula. Fechas en hora de Ecuador.</p></details>`;
  const msg = $('#imsg'), box = (cls, html) => msg.innerHTML = `<div class="rounded-lg border px-4 py-3 text-sm ${cls}">${html}</div>`;
  const pick = async f => {
    if (!f) return;
    box('bg-stone-50 border-stone-200 text-stone-600', 'Leyendo el archivo…');
    try {
      const P = parseExcel(await f.arrayBuffer());
      if (P.errs.length) return box('bg-red-50 border-red-300 text-red-800',
        `<b>No se importó nada.</b> Corrige el Excel y vuelve a subirlo:<ul class="list-disc pl-5 mt-1">${P.errs.slice(0, 12).map(e => `<li>${esc(e)}</li>`).join('')}</ul>${P.errs.length > 12 ? `<p class="mt-1">…y ${P.errs.length - 12} error(es) más.</p>` : ''}`);
      const nR = Object.keys(P.routes).length, nT = Object.keys(P.trips).length, nH = Object.keys(P.history).length, nP = Object.keys(P.trucks).length;
      if (!confirm(`Se reemplazará TODA la información actual por la del Excel:\n\n• ${nR} rutas\n• ${nT} viajes del chofer\n• ${nH} registros de báscula\n• ${nP} placas\n\nLas solicitudes pendientes se vaciarán. ¿Continuar?`))
        return box('bg-stone-50 border-stone-200 text-stone-600', 'Importación cancelada. No se cambió nada.');
      applyImport(P);
      box('bg-eco-50 border-eco-300 text-eco-800', `<b>Importación completa.</b> ${nR} rutas · ${nT} viajes · ${nH} registros de báscula · ${nP} placas.
        <div class="mt-2 flex gap-2 flex-wrap">${[['dash', 'Ver Flota estado'], ['cal', 'Ver Calendario'], ['report', 'Ver Informe por ruta']].map(([k, t]) =>
          `<button data-go="${k}" class="${B} bg-resa-600 text-white hover:bg-resa-700 !py-2">${t}</button>`).join('')}</div>`);
      msg.querySelectorAll('[data-go]').forEach(b => b.onclick = () => document.querySelector(`#tabs button[data-t="${b.dataset.go}"]`).click());
    } catch (e) { box('bg-red-50 border-red-300 text-red-800', `<b>No se pudo leer el archivo.</b> ${esc(e.message || e)}`); }
  };
  const inp = $('#ifile');
  inp.onchange = async () => { const f = inp.files[0]; await pick(f); inp.value = ''; };
}

route();
</script>
</body>
</html>
